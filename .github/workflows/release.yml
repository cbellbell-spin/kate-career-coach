name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The canonical validators live in cowork-plugin-tooling so every plugin
      # repo checks the same rules. The previous inline validation here was a
      # hand-rolled subset and missed real defects — notably the hooks.json
      # flat-schema and SessionStart prompt-type failures, both of which Cowork
      # rejects on upload.
      - name: Fetch shared tooling
        uses: actions/checkout@v4
        with:
          repository: cbellbell-spin/cowork-plugin-tooling
          path: .tooling

      - name: Check tag matches plugin.json version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          MANIFEST_VERSION=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION does not match plugin.json version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Version check passed: $MANIFEST_VERSION"

      - name: Build plugin zip
        run: .tooling/build-plugin.sh

      - name: Validate
        run: |
          ZIP=$(ls -t *.zip | head -1)
          echo "Validating $ZIP"
          python3 .tooling/validate-cowork-plugin.py "$ZIP"
          python3 .tooling/test_plugin.py "$ZIP"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
          token: ${{ secrets.RELEASE_PAT }}
